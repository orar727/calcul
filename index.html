<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calc Cursă</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; padding: 16px; margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  label { font-size: 11px; text-transform: uppercase; color: #888; }
  input { width: 100%; font-size: 24px; padding: 10px; background: #222; border: 1px solid #444; border-radius: 8px; color: #fff; text-align: center; box-sizing: border-box; }
  #rezultat { font-size: 26px; font-weight: bold; text-align: center; padding: 14px; border-radius: 8px; background: #1c1c1e; }
  .verde { color: #30d158; border: 2px solid #30d158; }
  .galben { color: #ffd60a; border: 2px solid #ffd60a; }
  .rosu { color: #ff453a; border: 2px solid #ff453a; }
  .reset-btn { width: 100%; margin-top: 10px; padding: 12px; font-size: 16px; background: #333; color: #bbb; border: none; border-radius: 8px; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <label>Bani (lei)</label>
      <input type="number" id="bani" inputmode="decimal" placeholder="0">
    </div>
    <div>
      <label>Km Client</label>
      <input type="number" id="km1" inputmode="decimal" placeholder="0">
    </div>
    <div>
      <label>Km Cursă</label>
      <input type="number" id="km2" inputmode="decimal" placeholder="0">
    </div>
  </div>

  <div id="rezultat">Introdu datele</div>
  <button class="reset-btn" onclick="reseteaza()">Golire</button>

<script>
  const b = document.getElementById('bani');
  const k1 = document.getElementById('km1');
  const k2 = document.getElementById('km2');
  const rez = document.getElementById('rezultat');

  function calculeaza() {
    const bani = parseFloat(b.value) || 0;
    const kmTotal = (parseFloat(k1.value) || 0) + (parseFloat(k2.value) || 0);

    if (bani > 0 && kmTotal > 0) {
      const r = (bani / kmTotal).toFixed(2);
      let status = '';
      rez.className = '';

      if (r >= 3.0) {
        rez.className = 'verde';
        status = 'EXCELENT';
      } else if (r >= 2.3) {
        rez.className = 'galben';
        status = 'DECENT';
      } else {
        rez.className = 'rosu';
        status = 'SLAB (REFUZ)';
      }
      rez.innerText = `${r} lei/km • ${status}`;
    } else {
      rez.className = '';
      rez.innerText = 'Introdu datele';
    }
  }

  function reseteaza() {
    b.value = ''; k1.value = ''; k2.value = '';
    rez.className = ''; rez.innerText = 'Introdu datele';
    b.focus();
  }

  [b, k1, k2].forEach(el => el.addEventListener('input', calculeaza));
</script>
</body>
</html>
